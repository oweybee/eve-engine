# ────────────────────────────────────────────────────────────────────────────
# MaxEdge EVE Engine  —  live odds pipeline
#
# Budget: 75,000 API req/day
#   96 jobs/day × up to 4 ingest loops × ~12 fixtures = ~4,608 req/day (6%)
#   Odds refresh every ~55 seconds across the loop window.
#
# CADENCE RULE, learned the hard way on 6 Aug 2026:
#   bounded loop (≤420s)  <  timeout-minutes (12)  <  cron interval (15 min)
# Break that ordering and runs are killed mid-flight, which shows up as
# 'cancelled' and writes nothing — indistinguishable from a quiet slate.
#
# Pipeline per job:
#   (Betfair secondary markets — corners/cards/O-U/BTTS — are ingested from a UK
#    host, not here; Betfair geo-blocks US runners. See scripts/betfair-vps/.)
#   Once per job (idempotent early-exit if plan exists):
#     0. planDay.js       — build / refresh today+3day fixture plan
#   Loop ×4 max, wall-clock bounded, one iteration per ~55s cycle:
#     1. ingestOdds.js    — pull latest odds; plan-gated (off-hours = no-op)
#     2. computeValues.js — Kaunitz edge detection; price-change signals
#     3. captureSnapshot.js — odds time-series for charts
#   Once per job:
#     5. postToX.js          — Telegram: VALUE / RUBY / ODDS MOVEMENT alerts
#     6. fetchResults.js     — settle completed fixtures
#     7. fetchMatchDetails.js — lineups + stats
# ────────────────────────────────────────────────────────────────────────────

name: MaxEdge EVE Engine

on:
  schedule:
    # EVERY 15 MINUTES, AND THE INTERVAL MUST EXCEED THE JOB DURATION.
    #
    # This was '*/5' against a job that measured 616s (10m16s) — twice its own
    # window. Eight of the last eight runs before this change ended
    # 'cancelled' and the board went stale for an hour at a time.
    #
    # The proximate killer was `timeout-minutes: 10`, not the concurrency
    # group: the runs died between 610s and 633s, mid fetchMatchDetails, which
    # is the timeout to the second. That distinction is worth keeping, because
    # 'cancelled' in the run list looks like queue pressure and sends you to
    # the wrong knob. The queue was a real second-order problem — a job longer
    # than its interval guarantees a backlog, and only one run may sit pending
    # per group — but fixing the schedule alone would not have saved a single
    # run.
    #
    # So all three now agree: bounded loop < timeout < cron interval. A
    # 5-minute schedule that never completes is slower than a 15-minute one
    # that does.
    #
    # The budget, measured on run 31102483691:
    #   setup (checkout, node, npm, planDay)     12s
    #   live odds loop            now bounded  ≤300s (+72s overshoot, see below)
    #   tail (api, board, integrity, settle…)    16s
    #   fetch match details       now capped   ≤120s
    #   team stats + referees     now capped   ≤120s
    #   ────────────────────────────────────────────
    #   worst case                             ~640s  (10m40s)
    #   typical (measured 31104035153)         ~506s  (8m26s)
    #
    # The loop budget is checked BETWEEN iterations, so it can overshoot by one
    # iteration's work (~72s) — it cannot stop mid-compute. The two tail caps
    # are real step timeouts and cannot overshoot.
    #
    # An earlier version of this budget was wrong because it was measured on a
    # run whose tail had been SKIPPED after the loop failed, which made the
    # tail look like ~92s when fetchTeamStats alone can run 349s+. Measure the
    # budget on a run that actually finished.
    #
    # Against timeout-minutes: 12 and a 15-minute window, that is slack at both
    # ends. If the loop budget or the tail grows, RAISE THE TIMEOUT AND WIDEN
    # THE CRON TOGETHER — the failure is silent either way, because a killed
    # run writes nothing and looks identical to a quiet slate.
    #
    # Cadence is not really set here anyway: ingestOdds.js self-gates against
    # engine_plan.next_run_at, so it pulls when it is due regardless of how
    # often the workflow starts. The loop exists to poll across the window.
    - cron: '*/15 * * * *'

  workflow_dispatch:
    inputs:
      skip_ingest:
        description: 'Skip ingestOdds.js'
        type: boolean
        default: false
      skip_post:
        description: 'Skip postToX.js (suppress Telegram alerts)'
        type: boolean
        default: false
      skip_results:
        description: 'Skip fetchResults.js'
        type: boolean
        default: false
      loop_count:
        description: 'Number of ingest loops (default 4)'
        type: string
        default: '4'

concurrency:
  group: engine-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  engine:
    name: EVE Engine Tick
    runs-on: ubuntu-latest
    # 12 min, and it must sit ABOVE the expected job duration and BELOW the
    # cron interval. Both halves matter.
    #
    # At 10 min it was the thing killing the pipeline. Measured on run
    # 31102483691: the job ran 616s (10m16s) and was cancelled mid
    # fetchMatchDetails by this timeout — as were the five runs before it, all
    # landing between 610s and 633s. That reads as "cancelled" in the run list,
    # which is easy to misread as concurrency pressure; it was the job simply
    # running longer than it was allowed to.
    #
    # With the loop now bounded at 420s the expected duration is ~527s (8m47s),
    # so 12 min leaves real slack for a slow tail without ever approaching the
    # 15-minute cron. fetchTeamStats self-caches per team (20h), so only the
    # first full population is slow.
    timeout-minutes: 12

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      API_FOOTBALL_KEY:          ${{ secrets.API_FOOTBALL_KEY }}
      BETFAIR_APP_KEY:           ${{ secrets.BETFAIR_APP_KEY }}
      BETFAIR_USERNAME:          ${{ secrets.BETFAIR_USERNAME }}
      BETFAIR_PASSWORD:          ${{ secrets.BETFAIR_PASSWORD }}
      TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
      ACTIVE_START_HOUR:         '0'
      ACTIVE_END_HOUR:           '24'
      DAILY_REQUEST_BUDGET:      ${{ vars.DAILY_REQUEST_BUDGET || '75000' }}
      # LAMBDA_MC is switched off (Phase 0) — no-vig CLV -3.58% at z -9.41 over
      # 166 settled rows. The step is gone; this stays pinned false so setting
      # the repo variable cannot quietly restart it.
      LAMBDA_BOARD_ENABLED:      'false'
      # onnxruntime-node postinstall fetches CUDA extras we don't need
      ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
      # The Odds API — UK soft-book BREADTH (complements API-Football).
      # Sized for the 100k-credit tier; the guard stops at ODDS_API_RESERVE.
      ODDS_API_KEY:              ${{ secrets.ODDS_API_KEY }}
      ODDS_API_REGIONS:          ${{ vars.ODDS_API_REGIONS || 'uk' }}
      ODDS_API_MARKETS_PREMATCH: ${{ vars.ODDS_API_MARKETS_PREMATCH || 'h2h,totals' }}
      ODDS_API_MARKETS_INPLAY:   ${{ vars.ODDS_API_MARKETS_INPLAY || 'h2h' }}
      ODDS_API_RESERVE:          ${{ vars.ODDS_API_RESERVE || '2000' }}
      ODDS_API_MONTHLY_CREDITS:  ${{ vars.ODDS_API_MONTHLY_CREDITS || '100000' }}
      SHARPNESS_MULTI_BOOK:      ${{ vars.SHARPNESS_MULTI_BOOK  }}
      SHARPNESS_SINGLE_BOOK:     ${{ vars.SHARPNESS_SINGLE_BOOK }}
      MULTI_BOOK_THRESHOLD:      ${{ vars.MULTI_BOOK_THRESHOLD  }}
      COMPUTE_CONCURRENCY:       ${{ vars.COMPUTE_CONCURRENCY   }}
      EV_THRESHOLD:              ${{ vars.EV_THRESHOLD          }}
      MIN_PROB:                  ${{ vars.MIN_PROB              }}
      MAX_ODDS:                  ${{ vars.MAX_ODDS              }}
      SIGNAL_EDGE:               ${{ vars.SIGNAL_EDGE           }}
      GITHUB_RUN_ID:             ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Plan today's fixtures
        id: plan
        continue-on-error: true
        env:
          DAYS_AHEAD: '3'
        run: node planDay.js

      # Betfair ingest does NOT run here: Betfair geo-blocks GitHub's US runners
      # (HTTP 403 "Restricted"). It runs on a UK host instead — see
      # scripts/betfair-vps/README.md — writing corners/cards/O-U/BTTS straight
      # to Supabase, which this pipeline then prices on the next compute.

      - name: Live odds loop (ingest -> compute -> snapshot)
        id: ingest_loop
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_ingest != 'true' }}
        shell: bash
        run: |
          # WALL-CLOCK BOUNDED. See the header note on cadence.
          #
          # This loop used to sleep a FIXED 55s after each iteration, so its
          # real period was "work + 55s", not "one iteration per 55s". Measured
          # on run 31102483691: work ~72s + sleep 55s = ~127s per iteration, so
          # four iterations took 508s of a 616s job — against a 5-minute cron.
          # Every run therefore overran its own window, a permanent backlog
          # formed, and GitHub cancelled the queued run each time a newer one
          # displaced it. Eight of the last eight runs were cancelled.
          #
          # Two changes. The sleep is now the REMAINDER of the cycle, so the
          # cadence is genuinely one iteration per CYCLE seconds when the work
          # fits. And the loop stops at a wall-clock BUDGET regardless of how
          # many iterations it has managed, so the job duration is bounded by
          # something we choose rather than by how slow compute happened to be.
          # If compute slows down, the loop does fewer iterations instead of
          # overrunning the window — degrade the work, never the schedule.
          LOOPS=${{ github.event.inputs.loop_count || '4' }}
          BUDGET=${LOOP_BUDGET_SECONDS:-300}
          CYCLE=${LOOP_CYCLE_SECONDS:-55}
          LOOP_EXIT=0
          START=$SECONDS

          for i in $(seq 1 "$LOOPS"); do
            ELAPSED=$(( SECONDS - START ))
            if [ "$ELAPSED" -ge "$BUDGET" ]; then
              echo "Loop budget ${BUDGET}s spent after $(( i - 1 )) iteration(s) — stopping so the job finishes inside its cron window."
              break
            fi

            echo "--- Loop $i / $LOOPS (t+${ELAPSED}s of ${BUDGET}s) ---"
            ITER_START=$SECONDS
            node ingestOdds.js    || LOOP_EXIT=$?
            node computeValues.js || LOOP_EXIT=$?
            # NOT `2>/dev/null`. That discarded the reason this script failed on
            # every run from 18 Aug 14:17 to 19 Aug 23:00 — its prefetch built a
            # ~32KB `.in(...)` URL and the request was rejected — while the step
            # stayed green and `odds_snapshots` quietly stopped being written.
            # It is still non-fatal on purpose: a snapshot problem must not stop
            # ingest or compute, which is why it does not set LOOP_EXIT. But
            # non-fatal and SILENT are different things, and only one of them is
            # defensible.
            node captureSnapshot.js || echo "::warning::captureSnapshot failed (exit $?) — odds_snapshots not written this iteration"
            WORK=$(( SECONDS - ITER_START ))

            if [ "$i" -lt "$LOOPS" ]; then
              REST=$(( CYCLE - WORK ))
              # Never sleep past the budget: a sleep that outlives the window
              # is the overrun, just quieter.
              LEFT=$(( BUDGET - (SECONDS - START) ))
              [ "$REST" -gt "$LEFT" ] && REST=$LEFT
              if [ "$REST" -gt 0 ]; then
                echo "Work took ${WORK}s; sleeping ${REST}s to complete the ${CYCLE}s cycle..."
                sleep "$REST"
              else
                echo "Work took ${WORK}s, at or over the ${CYCLE}s cycle — continuing without sleep."
              fi
            fi
          done
          exit $LOOP_EXIT

      # Soft-book breadth sweep. Sparse by design: API-Football supplies the
      # frequency, this supplies the books. Never fails the pipeline.
      - name: Ingest odds — The Odds API (soft-book breadth)
        id: odds_api
        continue-on-error: true
        run: node ingestOddsApi.js

      # API_PREDICTIVE and LAMBDA_MC ARE SWITCHED OFF — Phase 0 of the engine
      # consolidation, 18 Aug 2026. Both were the wrong side of the closing
      # line at sample sizes where that is settled, measured against the
      # Shin-de-vigged fair close:
      #
      #     API_PREDICTIVE   n=230   no-vig CLV -3.26%   z -8.60
      #     LAMBDA_MC        n=166   no-vig CLV -3.58%   z -9.41
      #
      # The read-side guards already stripped their claims, but the guards stop
      # a row being SCORED, not written — both were still producing rows every
      # cycle. Switching them off at the writer is the point.
      #
      # The steps are deleted rather than commented out; the scripts also refuse
      # to run without an explicit override, so neither can come back by
      # accident. Rollback is that env flag, per the plan's config-flip rule.

      # The "constant eye" — asserts the published maths is internally consistent
      # (probabilities in range, edge <-> odds coherent, no implausible edges,
      # value flags valid, signals self-consistent). Never gates the pipeline;
      # alerts via ENGINE_ALERT_WEBHOOK on any violation.
      - name: Data integrity check
        id: integrity
        continue-on-error: true
        run: node verifyIntegrity.js

      - name: Post signals
        id: post
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_post != 'true' }}
        run: node postToX.js

      - name: Settle results
        id: results
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_results != 'true' }}
        run: node fetchResults.js

      # ELO ladder feeds the in-play half-time supermodel (computeInplayValues
      # Stage 2). Self-gates on ELO_REFRESH_HOURS so it only fully recomputes a
      # few times a day, not every 5-minute tick.
      # DB-only steps — independent of the ingest loop. Run even if an earlier
      # step failed (a rate-limited ingest loop must not skip baseline capture,
      # or inplay_baseline never populates and the win-prob stage has no anchor).
      - name: Rebuild ELO ladder
        id: elo
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node computeElo.js

      # Freeze pre-match goal expectations (λ) for upcoming matches — the anchor
      # for the in-play win-probability engine (computeInplayValues Stage 3).
      - name: Capture in-play baselines
        id: baseline
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node captureBaseline.js

      # Daily forward-test ledger for the suggested accumulators (idempotent).
      - name: Record suggested accas
        id: accas
        continue-on-error: true
        run: node recordAccas.js

      # BOTH TAIL STEPS ARE TIME-BOXED. `continue-on-error` alone does not save
      # them: it covers a step FAILING, not the job timeout killing it, and the
      # job timeout takes the whole run down as 'cancelled'. On run 31104035153
      # this step took 98s and fetchTeamStats then ran 349s and was still going
      # when the 12-minute job timeout fired. Both self-cache and make partial
      # progress, so being cut short costs a little freshness and nothing else.
      - name: Fetch match details (lineups + stats)
        id: details
        continue-on-error: true
        timeout-minutes: 3
        run: node fetchMatchDetails.js

      - name: Team statistics & referee tendencies
        id: teamstats
        continue-on-error: true
        # 3m against the script's own 100s budget. THE ORDER OF THOSE TWO
        # NUMBERS IS THE POINT: the script must stop itself before the step
        # kills it, because `referee_stats` is written after the team loop and a
        # SIGKILL discards the whole aggregate and prints no summary. The
        # timeout is now the backstop it was meant to be, not the mechanism.
        timeout-minutes: 4
        shell: bash
        run: |
          # Rolling last-N form / corners / cards / xG per team. Run every
          # invocation — the script self-caches per team (TEAM_STATS_REFRESH_HOURS,
          # default 20h), so re-running it is cheap and it only refetches stale
          # teams. The previous wall-clock gate never aligned with the real
          # dispatch-driven cadence, so stats never populated.
          #
          # AND IT STILL DID NOT POPULATE THEM. Until 20 Aug 2026 the script
          # resolved teams for EVERY scheduled match — 9,152 of them, one HTTP
          # call plus a 120ms sleep each — before any team work began, so it was
          # killed at the timeout every run and `team_statistics` had not been
          # written since 6 Aug. It is bounded to a 3-day kickoff horizon now
          # (242 fixtures, not 9,152), ordered nearest-first, and works through
          # teams stalest-first so consecutive budget-stopped runs cover the set.
          node fetchTeamStats.js

      - name: Alert on pipeline failure
        if: failure()
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.ENGINE_ALERT_WEBHOOK }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          FAILED_STEPS=""
          [ "${{ steps.plan.outcome }}"        = "failure" ] && FAILED_STEPS="${FAILED_STEPS}\n- plan (planDay.js)"
          [ "${{ steps.ingest_loop.outcome }}" = "failure" ] && FAILED_STEPS="${FAILED_STEPS}\n- ingest-loop (ingestOdds + computeValues + captureSnapshot)"
          [ "${{ steps.post.outcome }}"         = "failure" ] && FAILED_STEPS="${FAILED_STEPS}\n- post-signals (postToX.js)"
          [ "${{ steps.results.outcome }}"      = "failure" ] && FAILED_STEPS="${FAILED_STEPS}\n- settle-results (fetchResults.js)"
          [ "${{ steps.details.outcome }}"      = "failure" ] && FAILED_STEPS="${FAILED_STEPS}\n- fetch-details (fetchMatchDetails.js)"
          [ -z "$FAILED_STEPS" ] && FAILED_STEPS="\n- setup (checkout/node/npm)"

          if [ -n "$WEBHOOK_URL" ]; then
            PAYLOAD=$(printf '{"content":"[FAIL] EVE Engine pipeline failure\nBranch: %s\nRun: %s\nFailed steps:%s"}' \
              "${{ github.ref_name }}" "$RUN_URL" "$FAILED_STEPS")
            curl -s -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d "$PAYLOAD" || true
          fi
          echo "Pipeline failed — steps:$FAILED_STEPS"
