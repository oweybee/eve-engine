# MaxEdge — the Discord channel.
#
# Discord is our own server, not a public timeline, so the cadence can follow
# the board: signals every 15 minutes (into the Plus-only #signals forum,
# no delay), results hourly, the record card on Monday morning, a daily
# trends card to #hit-rates and price movers to #market-pulse three times a day.
#
# THE SWITCH IS IN THE ENVIRONMENT. DISCORD_POSTING_ENABLED must be exactly '1'
# or every mode does nothing, so the channel stops from the repo secrets.
# Webhook URLs are secrets: anyone holding one can post as the bot.

name: Post to Discord

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # signals
    - cron: '41 * * * *'           # results
    - cron: '13 8 * * 1'           # weekly record, Monday 08:13 UTC
    - cron: '5 7 * * *'            # trends to #hit-rates, daily 07:05 UTC
    - cron: '35 9,12,17 * * *'     # movers to #market-pulse, 3x daily
  workflow_dispatch:
    inputs:
      mode:
        description: 'signals | results | weekly | trends | movers | delete'
        type: choice
        options: [signals, results, weekly, trends, movers, delete]
        default: signals
      delete_channel:
        description: 'delete only: which webhook posted it'
        type: choice
        options: [hitrates, pulse, results, record, signals]
        default: hitrates
      delete_ids:
        description: 'delete only: message ids, comma separated'
        type: string
        default: ''
      dry_run:
        description: 'Compose and print, send nothing'
        type: boolean
        default: true

concurrency:
  group: post-to-discord
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check the compliance rails
        run: node engine.discord.test.js

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "m=${{ inputs.mode }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "41 * * * *" ]; then echo "m=results" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "13 8 * * 1" ]; then echo "m=weekly" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "5 7 * * *" ]; then echo "m=trends" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "35 9,12,17 * * *" ]; then echo "m=movers" >> "$GITHUB_OUTPUT";
          else echo "m=signals" >> "$GITHUB_OUTPUT"; fi

      - name: Post
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_POSTING_ENABLED:   ${{ secrets.DISCORD_POSTING_ENABLED }}
          DISCORD_WEBHOOK_SIGNALS:   ${{ secrets.DISCORD_WEBHOOK_SIGNALS }}
          DISCORD_WEBHOOK_RESULTS:   ${{ secrets.DISCORD_WEBHOOK_RESULTS }}
          DISCORD_WEBHOOK_RECORD:    ${{ secrets.DISCORD_WEBHOOK_RECORD }}
          DISCORD_WEBHOOK_HITRATES:  ${{ secrets.DISCORD_WEBHOOK_HITRATES }}
          DISCORD_WEBHOOK_PULSE:     ${{ secrets.DISCORD_WEBHOOK_PULSE }}
          DISCORD_DAILY_CAP:         ${{ vars.DISCORD_DAILY_CAP }}
          DELETE_CHANNEL:            ${{ inputs.delete_channel }}
          DELETE_IDS:                ${{ inputs.delete_ids }}
          DRY_RUN:                   ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: node postToDiscord.js ${{ steps.mode.outputs.m }}
