name: Run EVE In-Play

# In-play pipeline, separate from the 15-min pre-match engine.
#
# CADENCE CAVEAT: in-play edges close in seconds-to-minutes. GitHub Actions'
# minimum schedule is 5 minutes AND it is best-effort (can lag several minutes
# under load), so this is a pragmatic floor, not true real-time. If/when live
# value proves out, move ingestLiveOdds + computeInplayValues to a dedicated
# short-loop worker (e.g. a small always-on process polling every 20-30s during
# live windows). The code is cadence-agnostic — only this trigger changes.
on:
  schedule:
    # Offset from engine.yml's '*/5' (fires at :02,:07,… not :00,:05,…). Sharing
    # the exact same minute as another '*/5' workflow can get this one
    # deprioritised by GitHub's scheduler; the offset also de-conflicts runners.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

# Don't pile up overlapping in-play runs.
concurrency:
  group: eve-inplay
  cancel-in-progress: false

jobs:
  run-inplay:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ODDS_API_KEY:              ${{ secrets.ODDS_API_KEY }}
      ODDS_API_REGIONS:          ${{ vars.ODDS_API_REGIONS || 'uk' }}
      ODDS_API_MARKETS_INPLAY:   ${{ vars.ODDS_API_MARKETS_INPLAY || 'h2h' }}
      ODDS_API_RESERVE:          ${{ vars.ODDS_API_RESERVE || '2000' }}
      ODDS_API_MONTHLY_CREDITS:  ${{ vars.ODDS_API_MONTHLY_CREDITS || '100000' }}
      API_FOOTBALL_KEY:          ${{ secrets.API_FOOTBALL_KEY }}
      # Stage 2 (model-vs-market) stays OFF until a parity live-feature service
      # exists — see computeInplayValues.js buildHalftimeFeatures(). Flip to
      # 'true' only then; until then it is a safe no-op.
      INPLAY_MODEL_ENABLED:      'false'
      # Win-probability stage (internationals + universal). ENABLED — backtest
      # validated pre-match ≈ market and in-play @ HT sharper than pre-match.
      # With TELEGRAM_INPLAY_CHAT_ID unset these are recorded, not posted.
      INPLAY_WINPROB_ENABLED:    'true'
      INPLAY_EV_THRESHOLD:       '0.02'
      # Second Half Sniper (Stage 4) — half-time Over 1.5/2.5 on a hot scoreline,
      # priced off the frozen inplay_baseline λ vs the live Over price. ENABLED.
      # Reads the live Over/Under feed ingestLiveOdds.js now writes; with
      # TELEGRAM_INPLAY_CHAT_ID unset these are recorded, not posted.
      SECOND_HALF_SNIPER_ENABLED: 'true'
      # Telegram — in-play posts route to the dedicated channel. If unset,
      # in-play signals are recorded but NOT posted (never leak to the main feed).
      TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_INPLAY_CHAT_ID:   ${{ secrets.TELEGRAM_INPLAY_CHAT_ID }}
      # The in-play channel. Two switches, on purpose: this flag admits in-play
      # rows past the publication gate in fetchRecentSignals (they are NOT in
      # PUBLICATION and never will be — see lib/publication.js), and the chat
      # id above decides where they go. With the flag on and the id UNSET
      # nothing is posted and the run says so, which is the safe order to
      # arrive in: the format can be watched in the log before a channel exists.
      INPLAY_BROADCAST_ENABLED:  'true'
      # Self-polling. LOOP_MINUTES must EXCEED the gap GitHub actually
      # delivers (median ~35m on this repo) so a fresh tick lands while this
      # loop is still running and GitHub holds it as the single pending run —
      # coverage closes up instead of gapping. PASS_INTERVAL is the real
      # cadence. The Odds API step is metered and keeps its own slower clock.
      INPLAY_LOOP_MINUTES:            '50'
      INPLAY_PASS_INTERVAL_SECONDS:   '60'
      INPLAY_ODDS_API_INTERVAL_SECONDS: '600'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # THE SIX STEPS THAT USED TO BE HERE ARE NOW ONE LOOP. They run in the
      # same order, as the same scripts, unchanged — runInplayLoop.js spawns
      # them — but repeatedly for INPLAY_LOOP_MINUTES rather than once per
      # GitHub tick. The cron above asks for twelve ticks an hour and GitHub
      # delivered about 1.3 on 26 Aug; see that file's header for the measured
      # gaps and for the match it cost. Raise INPLAY_LOOP_MINUTES, not the
      # cron, if holes reappear.
      #
      # `timeout-minutes` MUST stay above INPLAY_LOOP_MINUTES: the loop stops
      # itself before a pass would overrun its own budget, and being killed is
      # not the same as stopping — a killed run prints no summary, which is how
      # this repo has already lost a fortnight of team statistics.
      - name: In-play loop (live odds → values → series → post)
        timeout-minutes: 55
        run: node runInplayLoop.js

      # `if: failure()` DOES NOT RUN ON A CANCELLED JOB, and a job killed by a
      # timeout ends as cancelled rather than failed — the finding engine.yml
      # already carries. always() covers all three outcomes.
      - name: Report loop health
        if: always()
        run: |
          OUTCOME='${{ job.status }}'
          if [ "$OUTCOME" = "success" ]; then
            echo "[loop] job succeeded"
            exit 0
          fi
          echo "::error::in-play loop ended $OUTCOME — live coverage has a hole"
          if [ -n "${{ secrets.ALERT_WEBHOOK_URL }}" ]; then
            printf '{"text":"in-play loop ended %s — run %s"}' \
              "$OUTCOME" "${{ github.run_id }}" \
              | curl -sS -X POST -H 'Content-Type: application/json' \
                     -d @- '${{ secrets.ALERT_WEBHOOK_URL }}' || true
          fi
