# ──────────────────────────────────────────────────────────────────────────────
# MaxEdge — freeze the closing line at kickoff
#
# CLV is the only feedback this platform can get inside a week, and it is what
# `paper_trade_gate()` opens the publication gate on. It needs a benchmark that
# is genuinely the CLOSE: the last price vector quoted STRICTLY BEFORE kickoff,
# Shin-de-vigged.
#
# It had neither. `odds_snapshots.snapshot_type = 'closing'` labels anything
# from 60 minutes before kickoff to 180 minutes after — 71% of those rows were
# captured after kickoff, median 42 minutes INTO the match — and `no_vig_clv`
# came from a proportional de-vig of one arbitrary book.
#
# This job re-reads history rather than sampling now, and the database enforces
# `quoted_at <= kickoff_at`, so a late run is still a correct one. Read-only
# against the odds already stored; burns no API quota.
# ──────────────────────────────────────────────────────────────────────────────

name: MaxEdge Capture Closing Lines

on:
  schedule:
    # Every 15 minutes at :08, offset from the engine's '*/15'. A fixture's
    # closing line is frozen within a quarter-hour of kickoff, and the 6-hour
    # lookback means a run of missed jobs costs nothing.
    - cron: '8/15 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Process every past fixture still missing a closing line'
        type: boolean
        default: false

concurrency:
  group: closing-lines-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

# ── TWO JOBS, NOT TWO STEPS, AND THAT IS THE FIX ──────────────────────────────
#
# These ran as step 5 and step 6 of ONE job under a shared `timeout-minutes: 15`,
# so the anchor spent the budget and the independent line got whatever was left.
# On the 21 Aug 2026 backfill that was nine minutes against six: step 5 finished,
# step 6 started at 18:47 and was killed by the job timeout with the table still
# a month stale — while the run reported the failure as a timeout rather than as
# a benchmark that never got written.
#
# BEING KILLED IS NOT STOPPING. eve-engine has already paid for that once, in
# `fetchTeamStats`, where a SIGKILL discarded the aggregate the run had just
# computed and printed no summary — "a step that runs, burns two minutes and is
# killed looks exactly like one that works."
#
# The two tables are INDEPENDENT: different destinations, both read-only against
# `odds` and `matches`, no ordering between them. Nothing was ever gained by
# serialising them, and serialising them is what starved the second. As separate
# jobs they run in parallel, each holds its own timeout, and neither can consume
# the other's budget however long a backfill takes.
#
# 45 minutes rather than 15, because that ceiling was cut for the every-15-minute
# incremental run — which does ten fixtures and finishes in seconds — and a
# `--backfill` walks every past fixture still missing a line. The anchor's own
# backfill took 9 minutes against 745 fixtures and the corpus only grows.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  anchor:
    name: Freeze closing lines
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.backfill && 45 || 15 }}

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture closing lines
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ inputs.backfill }}" = "true" ]; then
            node captureClosingLines.js --backfill | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node captureClosingLines.js | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # The Pinnacle-EXCLUDED benchmark. It runs BESIDE the anchor, never instead of
  # it and — since 21 Aug 2026 — never after it: a model that selects against
  # Pinnacle cannot be scored against Pinnacle, and a model that does not still
  # deserves the sharper benchmark. Both are captured from the same pre-kickoff
  # window, so the two figures stay comparable fixture by fixture whichever job
  # finishes first. Migration 074 made `paper_trade_gate()` REQUIRE this table.
  independent:
    name: Freeze independent closing lines
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.backfill && 45 || 15 }}

    env:
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture independent closing lines
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ inputs.backfill }}" = "true" ]; then
            node captureIndependentLines.js --backfill | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node captureIndependentLines.js | tee -a "$GITHUB_STEP_SUMMARY"
          fi
